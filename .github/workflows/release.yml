name: Release

# Triggered automatically by tag push (created via `pnpm release` → bumpp).
# CHANGELOG.md is already part of the tagged release commit produced by
# `pnpm release`. This workflow does not generate or commit the changelog.
# Can also be re-run manually via `workflow_dispatch` for partial recovery
# (e.g. retry only npm-publish after a transient failure).
on:
  push:
    branches-ignore: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        required: true
        default: all
        options:
          - all
          - npm-publish
          - release-notes
      tag:
        description: Existing tag to release (e.g. v0.30.9). Required for workflow_dispatch.
        type: string
        required: true

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions: {}

jobs:
  npm-publish:
    name: Publish to npm
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.job == 'all' || inputs.job == 'npm-publish'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm OIDC trusted publisher + provenance
    steps:
      - name: Checkout codes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Resolve dist-tag from tag
        id: meta
        # SemVer prerelease: publish it under its first identifier, such as `beta` for
        # v1.0.0-beta.0, so that `latest` stays on the last stable release. Use `next` for an
        # identifier that starts with a digit, since npm rejects a dist-tag that is a semver
        # range, such as `0` of v1.0.0-0.
        run: |
          if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-([A-Za-z][0-9A-Za-z-]*) ]]; then
            echo "dist_tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            echo "dist_tag=next" >> "$GITHUB_OUTPUT"
          else
            echo "dist_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup node.js
        # zizmor: ignore[cache-poisoning] cache key is the pnpm-lock.yaml hash
        # and `pnpm install --frozen-lockfile` re-verifies integrity, so a
        # poisoned cache cannot influence what gets published to npm.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish each package to npm
        # OIDC trusted publisher: no secret is needed, and provenance is attached
        # automatically. Skip a version that is already published, so that a retry
        # with workflow_dispatch is idempotent. A version that npm is still
        # scanning is not found by `pnpm view`, so do not retry this job until npm
        # serves the versions. Retry `release-notes` only after this job succeeds.
        env:
          DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: |
          for PKG in packages/*/; do
            if [[ "$PKG" == "packages/docs/" ]]; then
              pnpm run build:docs
            fi
            if [[ "$PKG" == "packages/gunshi/" ]]; then
              cp -r assets "$PKG"assets
              cp README.md CHANGELOG.md LICENSE "$PKG"
            fi
            pushd "$PKG" > /dev/null
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if pnpm view "$name@$version" version > /dev/null 2>&1; then
              echo "↺ $name@$version already published, skipping"
            else
              echo "⚡ Publishing $name@$version to npm (dist-tag: $DIST_TAG)"
              pnpm publish --access public --no-git-checks --tag "$DIST_TAG"
            fi
            popd > /dev/null
          done

  release-notes:
    name: Create GitHub Release
    needs: [npm-publish]
    # Runs when:
    # - tag push and the publish job succeeded, OR
    # - workflow_dispatch with job=release-notes (the publish job is skipped), OR
    # - workflow_dispatch with job=all and the publish job succeeded
    # CHANGELOG.md is already in the tagged commit from `pnpm release`.
    if: >-
      always() && (
        (github.event_name == 'push' &&
          needs.npm-publish.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'release-notes') ||
        (github.event_name == 'workflow_dispatch' && inputs.job == 'all' &&
          needs.npm-publish.result == 'success')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub Release
    steps:
      - name: Checkout tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Create GitHub Release
        # Skip the release if it already exists, so that a retry with
        # workflow_dispatch is idempotent.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          else
            FLAGS=(--verify-tag --generate-notes)
            if [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+- ]]; then
              FLAGS+=(--prerelease)
            fi
            gh release create "$TAG" "${FLAGS[@]}"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
