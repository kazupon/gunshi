packages:
  - packages/*
  - playground/**
  - "!playground/bun"
allowBuilds:
  deno: true
  esbuild: true
  oxc-resolver: true
  rolldown: true
  unrs-resolver: true
# The packages depend on each other through devDependencies, for the tests and
# the types (e.g. @gunshi/bone -> gunshi -> @gunshi/plugin-i18n -> @gunshi/bone).
# pnpm 11 and later refuse to run recursive tasks across such cycles without
# this. Each package bundles the others from their sources (`paths` of
# tsconfig.json), so the build order within a cycle does not matter.
ignoreWorkspaceCycles: true
# moved from .npmrc, which pnpm 11 and later read only for the auth and registry settings
shellEmulator: true
# Ensure platform-specific optional bindings (e.g. @rolldown/binding-*) are
# installed across all platforms we publish/run on. Without this, pnpm only
# resolves the host platform's binding, which breaks CI on Linux when the
# lockfile was originally generated on macOS.
supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
catalog:
  typescript: ^6.0.3
  zod: ^4.4.3
  deno: ^2.7.14
  jsr: ^0.14.3
  jsr-exports-lint: ^0.4.2
  publint: ^0.3.20
  tsdown: 0.22.14
  "@types/node": ^25.6.2
  vitepress-api-references: ^0.3.0
  tsx: ^4.21.0
  args-tokens: 1.0.0
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - deno
  - zod
  - knip
  - publint
  - tsx
  - args-tokens
  - "@bomb.sh/tab"
  - eslint-plugin-jsdoc
  - "@typescript/native-preview"
  - lint-staged
  - tsdown
  - vite
  - vitepress-api-references
  - "@ox-content/*"
  - rolldown
  - yaml
  - "@rolldown/*"
  - "@kazupon/eslint-config"
  - "@oxfmt/*"
  - gunshi
  - "@gunshi/*"
